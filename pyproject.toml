[project]
name = "a-stock-monitor"
version = "0.1.0"
description = "A股智能量化监控系统"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.14.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "mplfinance>=0.12.10b0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "apscheduler>=3.10.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.28.0", "streamlit-plotly-events>=0.0.6"]
notify = ["requests>=2.31.0"]
